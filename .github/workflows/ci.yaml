name: 🔁 CI
permissions:
  contents: read

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      verbosity:
        description: 'MSBuild verbosity level'
        required: false
        default: 'normal'
        type: choice
        options:
          - 'quiet'
          - 'minimal'
          - 'normal'
          - 'detailed'
          - 'diagnostic'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    name: 🐧 Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }} # Used by installation scripts to prevent API rate limits
      # https://docs.github.com/en/actions/how-tos/monitor-workflows/enable-debug-logging
      ACTIONS_RUNNER_DEBUG: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up runner
        uses: ./.github/actions/setup-runner

      - name: Run tests
        run: >
          dotnet run
          --project ./build/_build.csproj
          --target Test
          --commit ${{ github.sha }}
          --msbuildverbosity ${{ github.event.inputs.verbosity }}
          --platform linux_x64

      - name: Display test results
        continue-on-error: true
        if: always()
        run: dotnet trx --verbosity normal

      - name: Check for warnings
        run: >
          dotnet run
          --project ./build/_build.csproj
          --target CheckBuildWarnings

  test-windows:
    name: 🪟 Test
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }} # Used by installation scripts to prevent API rate limits
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Dev Drive
        uses: samypr100/setup-dev-drive@v4
        with:
          workspace-copy: true
          trusted-dev-drive: true
          drive-size: 6GB

      - name: Use Dev Drive for NuGet packages
        shell: pwsh
        run: |
          $packages = if ($env:NUGET_PACKAGES) {
            $env:NUGET_PACKAGES
          } else {
            Join-Path $env:DEV_DRIVE 'nuget\global-packages'
          }
          New-Item -ItemType Directory -Force -Path $packages | Out-Null
          "NUGET_PACKAGES=$packages" >> $env:GITHUB_ENV

      - name: Set up runner
        uses: ./.github/actions/setup-runner

      - name: Run tests
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        run: >
          dotnet run
          --project ./build/_build.csproj
          --target Test
          --commit ${{ github.sha }}
          --msbuildverbosity ${{ github.event.inputs.verbosity }}
          --platform win_x64

      - name: Display test results
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        continue-on-error: true
        if: always()
        run: dotnet trx --verbosity normal

      - name: Check for warnings
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        run: >
          dotnet run
          --project ./build/_build.csproj
          --target CheckBuildWarnings

  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0

      - name: Lint markdown
        run: |
          npm i -g markdownlint-cli@0.49.1
          markdownlint --config .markdownlint.jsonc '**/*.md'