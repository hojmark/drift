name: 🧟 Stryker
permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  stryker:
    name: Run Stryker
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Run Stryker
        run: >
          dotnet stryker --with-baseline:main -v 'ci'

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: stryker-output
          path: StrykerOutput/
          if-no-files-found: error