name: 🧟 Stryker
permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  stryker:
    name: Run Stryker
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up runner
        uses: ./.github/actions/setup-runner
        
      - name: Get CPU core count
        run: echo "$(nproc)"

      - name: Run Stryker
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: >
          dotnet stryker
          --with-baseline:main
          --version 'ci'
          --reporter markdown
          --reporter cleartext
          --reporter html
          --reporter json
          --reporter dots
      
      - name: Post step summary
        run: |
          FIRST_DIR=$(ls -d StrykerOutput/*/ | head -n 1)
          cat "${FIRST_DIR}reports/mutation-report.md" >> $GITHUB_STEP_SUMMARY

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: stryker-output
          path: StrykerOutput/
          if-no-files-found: error