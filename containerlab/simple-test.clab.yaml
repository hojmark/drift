name: drift-simple-test

topology:
  nodes:
    cli:
      kind: linux
      image: localhost:5000/drift:dev
      entrypoint: /bin/sh
      cmd: -c "sleep infinity"

    server:
      kind: linux
      image: localhost:5000/drift:dev
      cmd: server start --port 51510 --no-agent-port

    agent1:
      kind: linux
      image: localhost:5000/drift:dev
      cmd: agent start --port 5000
      ports:
        - "5001:5000"

    target1:
      kind: linux
      image: alpine:latest
      entrypoint: /bin/sh
      cmd: -c "sleep infinity"
